<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏观察</title><link rel="stylesheet" href="sidepanel.css"></head><body><main class="app">
<header class="top"><h1><span>COLLECTION ATLAS｜</span>收藏观察</h1></header>
<nav class="view-tabs" aria-label="功能切换"><button id="randomTab" class="active" type="button" aria-selected="true">收藏盲盒</button><button id="notesTab" type="button" aria-selected="false">Notes <span id="notesBadge"></span></button></nav>
<div id="randomView">
<section class="card reveal-card"><div class="heading"><div><small>MEMORY BOX</small><button id="nextTen" class="open-blind-box" type="button" aria-label="拆盲盒，随机换十条" title="拆盲盒，随机换十条"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 0 0-15.5-2M4 4v5h5M4 13a8 8 0 0 0 15.5 2M20 20v-5h-5"/></svg></button></div><span id="revealProgress"></span></div><div id="revealList"></div><p id="revealOpenStatus" class="footnote" role="status"></p><button id="resetTen" class="secondary reset-ten" type="button" hidden>重新洗牌</button><details id="excludedDetails" class="excluded-details" hidden><summary id="excludedSummary"></summary><div id="excludedList"></div></details></section>
<section class="card collect-card"><div class="heading"><div><small>COLLECTION</small><h2>补充收藏数据</h2></div></div><p class="footnote">仅在需要补充数据时使用。大量连续加载可能触发账号安全限制；已有收藏会按 ID 去重保留。</p><button id="quickScan" class="secondary">开始采集</button><button id="stopScanButton" class="secondary" hidden>停止采集</button><p id="backgroundStatus" class="footnote" role="status"></p></section>
</div>
<section id="notesView" hidden><div class="card notes-intro"><div class="heading"><div><small>YOUR NOTES</small><h2>划线与 Note</h2></div><strong id="notesCount">0 条</strong></div><p class="footnote">在小红书原笔记里选中文字，点“划线”；之后点高亮写 Note。图片里的文字不能选取时，可给整篇留 Note。</p><div class="notes-actions"><button id="noteCurrentPage" class="secondary">给当前笔记写 Note</button><button id="exportNotes" class="quiet">导出 Markdown</button></div><details class="backup-tools"><summary>数据备份与恢复</summary><p class="footnote">完整备份包含收藏索引、划线、Notes 和盲盒进度。导入时会按 ID 合并，不删除当前数据。</p><div class="notes-actions"><button id="exportButton" class="quiet" type="button">导出完整备份</button><button id="importData" class="quiet" type="button">导入完整备份</button><button id="importNotes" class="quiet" type="button">仅导入划线与 Notes</button><input id="importDataFile" type="file" accept="application/json,.json" hidden><input id="importNotesFile" type="file" accept="application/json,.json" hidden></div></details><p id="notesStatus" class="footnote" role="status"></p></div><div id="notesList"></div></section>
</main><script src="sidepanel.js"></script></body></html>
